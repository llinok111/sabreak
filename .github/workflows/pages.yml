name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the committed demo data matches the build
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: |
          if ! git diff --quiet -- demo/evidence.mjs; then
            echo "::error::demo/evidence.mjs is stale — run npm run build and commit the result"
            git diff --stat -- demo/evidence.mjs
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
