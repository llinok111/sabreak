name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the committed demo data matches the build
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci --no-audit --no-fund
      # Regenerate rather than diff: the evidence records the runtime it was produced
      # on (node/icu version), so a byte comparison against a commit made on another
      # machine would always fail. Staleness of the *segmentation data* is asserted
      # environment-independently by test/package.test.js instead.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
